name: Add app to source

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: sorssy-app-source
  cancel-in-progress: false

jobs:
  add-app:
    if: github.event.issue.user.login == 'albyatysjad74-art' && startsWith(github.event.issue.title, '[Sorssy]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate submission and update source
        id: process
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/scripts/process-sorssy-request.py

      - name: Commit updated source
        if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iQsign-Apps-Source.json sorssy-sources.json
          git commit -m "Update sorssy catalog from owner request"
          git push

      - name: Comment on request
        uses: actions/github-script@v7
        env:
          RESULT_STATUS: ${{ steps.process.outputs.status }}
          RESULT_MESSAGE: ${{ steps.process.outputs.message }}
        with:
          script: |
            const status = process.env.RESULT_STATUS || 'invalid';
            const message = process.env.RESULT_MESSAGE || 'تعذّر معالجة الطلب. راجع بيانات التطبيق وحاول مرة ثانية.';
            let body = message;
            if (['added', 'edited', 'source_added'].includes(status)) {
              body += '\n\nتم تحديث ملف السورس بنجاح. رابط السورس: https://raw.githubusercontent.com/albyatysjad74-art/sorssy/main/iQsign-Apps-Source.json';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            if (['added', 'edited', 'source_added', 'duplicate', 'unchanged'].includes(status)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
