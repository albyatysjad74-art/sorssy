name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Build and package unsigned IPA
        run: |
          chmod +x ios/build-unsigned-ipa.sh
          ios/build-unsigned-ipa.sh "$RUNNER_TEMP/sorssy-build"
          cp "$RUNNER_TEMP/sorssy-build/Sorssy-unsigned.ipa" "$GITHUB_WORKSPACE/Sorssy-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/Sorssy-unsigned.ipa" > "$GITHUB_WORKSPACE/Sorssy-unsigned.ipa.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorssy-ios-unsigned-ipa-${{ github.run_number }}
          path: |
            Sorssy-unsigned.ipa
            Sorssy-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
