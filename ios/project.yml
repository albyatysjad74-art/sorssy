name: Sorssy
options:
  bundleIdPrefix: app.sorssy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Sorssy:
    type: application
    platform: iOS
    sources:
      - path: Sorssy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sorssy.ios
        PRODUCT_NAME: Sorssy
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: sorssy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
